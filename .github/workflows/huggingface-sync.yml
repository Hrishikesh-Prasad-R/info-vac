name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git rm -rf --ignore-unmatch documentation frontend trial_UIs UI_example graphify-out
          git commit -m "chore: strip non-backend assets for Hugging Face deployment"
          git push --force https://HrishikeshRPrasad:$HF_TOKEN@huggingface.co/spaces/HrishikeshRPrasad/infovac-backend HEAD:refs/heads/main

