name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'orchestrator/**'
      - 'alembic/**'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -rf documentation frontend trial_UIs UI_example graphify-out
          rm -rf .git
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "deploy: clean backend deployment"
          git push --force https://HrishikeshRPrasad:$HF_TOKEN@huggingface.co/spaces/HrishikeshRPrasad/infovac-backend HEAD:refs/heads/main


